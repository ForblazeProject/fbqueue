name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --locked
      - name: Linux integration tests
        timeout-minutes: 10
        run: bash tests/run_tests.sh
      - name: Test harness verdict regression
        run: python3 -B tests/test_harness_verdicts.py
      - name: Test harness negative controls
        timeout-minutes: 3
        run: python3 -B tests/test_harness.py
